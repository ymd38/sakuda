# sakuda — single-container app. Host-side ports are read from .env
# (see .env.example: SAKUDA_PORT / SAKUDA_BIND) so this stack can coexist with
# other local stacks (internal-app on 3000/8080/5432, other-stack on
# 3002/8082/3307, ...). Everything inside the container stays on 3000.
#
#   make up          start sakuda
#
# The OWASP Juice Shop dry-run target is a separate compose project:
# targets/juice-shop/compose.yml (`make juice-up`).

services:
  sakuda:
    build: .
    image: sakuda:latest
    container_name: sakuda
    ports:
      - '${SAKUDA_BIND:-127.0.0.1}:${SAKUDA_PORT:-3001}:3000'
    environment:
      SAKUDA_ENCRYPTION_KEY: ${SAKUDA_ENCRYPTION_KEY:?put the output of `make keygen` into .env}
      SAKUDA_NUCLEI_MAX_MINUTES: ${SAKUDA_NUCLEI_MAX_MINUTES:-60}
      SAKUDA_NUCLEI_CONCURRENCY: ${SAKUDA_NUCLEI_CONCURRENCY:-25}
      SAKUDA_ENGINE_GRACE_MINUTES: ${SAKUDA_ENGINE_GRACE_MINUTES:-10}
      SAKUDA_ZAP_MAX_HEAP: ${SAKUDA_ZAP_MAX_HEAP:-1024m}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # ZAP's Ajax spider runs Firefox: needs a large /dev/shm and a few GB of RAM.
    shm_size: ${SAKUDA_SHM_SIZE:-1g}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - sakuda-data:/data
    restart: unless-stopped

volumes:
  sakuda-data:
